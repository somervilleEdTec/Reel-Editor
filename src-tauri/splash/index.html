<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reelwrite</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
        background: #111418;
        color: #e7ebf0;
      }
      h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.02em; }
      p { margin: 0; color: #9aa4b1; }
      p[data-error] { color: #ff8f8f; max-width: 34rem; }
    </style>
  </head>
  <body>
    <h1>Reelwrite</h1>
    <p id="status">Starting the local editing engine…</p>
    <script>
      // Called from the Rust shell when startup fails; the shell otherwise navigates
      // this window to http://127.0.0.1:8765/ as soon as /health answers.
      window.reelwriteError = (message) => {
        const status = document.getElementById("status");
        status.textContent = message;
        status.setAttribute("data-error", "");
      };
    </script>
  </body>
</html>
